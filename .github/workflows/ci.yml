name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp fmt --check
      - run: vp lint --report-unused-disable-directives
      - run: vp check
      - run: vpr typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run test
      - run: pnpm icons:check

  desktop_build:
    name: Desktop Build
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run --filter @t3tools/desktop test
      - run: vp run build:desktop
      - name: Verify preload bundle
        shell: pwsh
        run: |
          $preload = 'apps/desktop/dist-electron/preload.cjs'
          if (-not (Test-Path -LiteralPath $preload)) { throw "Missing $preload" }
          $source = Get-Content -Raw -LiteralPath $preload
          foreach ($symbol in 'desktopBridge', 'getLocalEnvironmentBootstrap', 'PICK_FOLDER_CHANNEL', 'wsUrl') {
            if (-not $source.Contains($symbol)) { throw "Preload is missing $symbol" }
          }
      - run: vp run --filter @t3tools/desktop smoke-test

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - run: node scripts/release-smoke.ts
