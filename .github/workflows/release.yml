name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: tag
        name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be exact vX.Y.Z semantic versions." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vpr typecheck
      - run: vp run test
      - run: node scripts/export-brand-icons.ts --check
      - run: node scripts/release-smoke.ts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  build_wsl_node_pty:
    name: Build WSL terminal module
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - name: Build Linux x64 WSL module
        shell: bash
        run: |
          set -euo pipefail
          package_json="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          package_dir="$(dirname "$package_json")"
          (cd "$package_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild
          cp "$package_dir/build/Release/pty.node" wsl-prebuild/pty.node
          test -s wsl-prebuild/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build ${{ matrix.id }}
    needs: [preflight, build_wsl_node_pty]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - id: macos-x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - id: windows-x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install Linux image tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
      - name: Download WSL terminal module
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Validate WSL terminal module
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'wsl-prebuild/pty.node')) {
            throw 'Missing Linux x64 WSL terminal module.'
          }
          if ((Get-Item -LiteralPath 'wsl-prebuild/pty.node').Length -eq 0) {
            throw 'Linux x64 WSL terminal module is empty.'
          }
      - name: Build desktop artifact
        if: matrix.platform != 'win'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --output-dir release-publish
          )
          node scripts/build-desktop-artifact.ts "${args[@]}"
      - name: Build self-signed Windows artifact
        if: matrix.platform == 'win'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
          JANUS_WINDOWS_SIGNING_PROVIDER: csc
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing WINDOWS_CODE_SIGNING_PFX_BASE64 secret}"
          : "${CSC_KEY_PASSWORD:?Missing WINDOWS_CODE_SIGNING_PFX_PASSWORD secret}"
          node scripts/build-desktop-artifact.ts \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --output-dir release-publish \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --signed
      - name: Verify self-signed Windows artifact
        if: matrix.platform == 'win'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = "release-publish/Janus-${{ needs.preflight.outputs.version }}-x64.exe"
          $certificatePath = 'certs/Janus-Code-Signing-Certificate.crt'
          $expectedCertificate = Get-PfxCertificate -FilePath $certificatePath
          $expectedThumbprint = $expectedCertificate.Thumbprint.ToUpperInvariant()
          $signToolPath = Get-ChildItem -Path "$env:LOCALAPPDATA\electron-builder\Cache" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'windows-10[\\/]x64[\\/]signtool\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signToolPath) {
            throw 'Could not locate the SignTool bundled with electron-builder.'
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $verificationLines = & $signToolPath verify /pa /all /v $installerPath 2>&1
          $verificationExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $verificationOutput = ($verificationLines | Out-String)
          $normalizedOutput = (($verificationLines | ForEach-Object { $_.ToString() }) -join ' ')
          $normalizedOutput = ($normalizedOutput -replace '\s+', ' ').Trim()
          $verificationOutput
          if ($verificationExitCode -ne 1) {
            throw "Expected SignTool's untrusted-root result for a self-signed certificate; received exit code $verificationExitCode."
          }
          if ($normalizedOutput -notmatch [regex]::Escape("SHA1 hash: $expectedThumbprint")) {
            throw 'The Windows installer signer does not match the published Janus certificate.'
          }
          if ($normalizedOutput -notmatch 'The signature is timestamped') {
            throw 'The Windows installer signature is not timestamped.'
          }
          if ($normalizedOutput -notmatch 'Number of errors: 1') {
            throw 'SignTool reported an unexpected number of signature errors.'
          }
          if ($normalizedOutput -notmatch 'root certificate which is not trusted') {
            throw 'SignTool did not report the expected self-signed trust-chain result.'
          }
      - name: Stage macOS updater manifest
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          source_manifest="release-publish/latest-mac.yml"
          test -s "$source_manifest"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            mv "$source_manifest" release-publish/latest-mac-x64.yml
          fi
      - name: Require platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          case "${{ matrix.platform }}" in
            mac)
              test -s "release-publish/Janus-${version}-${{ matrix.arch }}.dmg"
              test -s "release-publish/Janus-${version}-${{ matrix.arch }}.dmg.blockmap"
              test -s "release-publish/Janus-${version}-${{ matrix.arch }}.zip"
              test -s "release-publish/Janus-${version}-${{ matrix.arch }}.zip.blockmap"
              if [[ "${{ matrix.arch }}" == "arm64" ]]; then
                test -s release-publish/latest-mac.yml
              else
                test -s release-publish/latest-mac-x64.yml
              fi
              ;;
            linux)
              test -s "release-publish/Janus-${version}-x64.AppImage"
              test -s release-publish/latest-linux.yml
              ;;
            win)
              test -s "release-publish/Janus-${version}-x64.exe"
              test -s "release-publish/Janus-${version}-x64.exe.blockmap"
              test -s release-publish/latest.yml
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.id }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish Janus release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/latest-mac.yml
          test -s release-assets/latest-mac-x64.yml
          node scripts/merge-update-manifests.ts --platform mac \
            release-assets/latest-mac.yml release-assets/latest-mac-x64.yml
          rm release-assets/latest-mac-x64.yml
          test -s release-assets/latest-mac.yml
      - name: Stage public signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cp certs/Janus-Code-Signing-Certificate.crt \
            release-assets/Janus-Code-Signing-Certificate.crt
          test -s release-assets/Janus-Code-Signing-Certificate.crt
      - name: Validate release assets
        run: node scripts/validate-release-assets.ts --assets-dir release-assets --version ${{ needs.preflight.outputs.version }}
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - uses: actions/attest@v4
        with:
          subject-path: release-assets/Janus-*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: "Janus v${{ needs.preflight.outputs.version }}"
          generate_release_notes: true
          body: |
            The Windows installer is Authenticode-signed by the Janus Project's self-signed
            code-signing certificate. The public certificate is included in this release so
            the signer fingerprint can be verified. Its SHA-256 fingerprint is
            `DA:A9:7B:D5:9C:62:E5:1B:52:F5:60:2A:4D:89:9D:0A:6E:5C:47:D6:5B:F6:86:40:83:82:5F:CF:4B:63:E5:D8`.
            Windows does not trust this certificate automatically, so SmartScreen or other
            operating-system warnings may still appear.
          files: release-assets/*
          fail_on_unmatched_files: true
